name: Python checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 测试无需生产密钥，也不部署、发布或上传测试中的账号与数据库。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install application and test tools
        run: python -m pip install -e '.[test,build]'
      - name: Validate evaluation data structure
        run: python scripts/validate_evaluation.py
      - name: Run offline regression tests
        run: python -m pytest tests -q -p no:cacheprovider --basetemp "${{ runner.temp }}/dhls-pytest"
      - name: Build distribution with templates and static assets
        run: python -m build --outdir "${{ runner.temp }}/dhls-dist"
