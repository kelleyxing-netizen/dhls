name: 功能建议
description: 描述业务问题、预期能力和验收标准。
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 业务场景与当前问题
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 期望行为与验收标准
      description: 标明涉及的角色、部门、场馆、人工确认及数据权限。
    validations:
      required: true
